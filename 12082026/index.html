<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tchan-Zâca 360 — 01 à 08</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<style>
html,body,#panorama {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#111;
}
.pnlm-container { background:#111; }

/* Ne pas appliquer transform au hotspot externe :
   Pannellum l'utilise pour son positionnement dans la sphère. */
.sv-hotspot {
  width:110px !important;
  height:88px !important;
  margin-left:-55px !important;
  margin-top:-44px !important;
  background:none !important;
  border:none !important;
  cursor:pointer;
}

.sv-inner {
  position:absolute;
  inset:0;
  pointer-events:none;
  transform:perspective(170px) rotateX(60deg);
  transform-origin:50% 62%;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.55));
}

.sv-oval {
  position:absolute;
  left:15px;
  top:28px;
  width:80px;
  height:42px;
  border-radius:50%;
  background:rgba(55,145,245,.27);
  border:3px solid rgba(255,255,255,.95);
  box-sizing:border-box;
}

.sv-chevron {
  position:absolute;
  left:34px;
  top:11px;
  width:40px;
  height:40px;
  border-top:11px solid white;
  border-right:11px solid white;
  transform:rotate(-45deg);
  box-sizing:border-box;
}

#scene {
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.38);
  padding:5px 8px;
  border-radius:4px;
  font:12px Arial,sans-serif;
  pointer-events:none;
}

#error {
  display:none;
  position:fixed;
  left:20px; right:20px; top:20px;
  z-index:99;
  color:#fff;
  background:#8b0000;
  padding:14px;
  font:14px Arial,sans-serif;
  border-radius:6px;
}
</style>
</head>

<body>
<div id="panorama"></div>
<div id="scene">01.png</div>
<div id="error"></div>

  const inner = document.createElement('div');
  inner.className = 'sv-inner';

  const oval = document.createElement('div');
  oval.className = 'sv-oval';

  const chevron = document.createElement('div');
  chevron.className = 'sv-chevron';

  inner.appendChild(oval);
  inner.appendChild(chevron);
  hotSpotDiv.appendChild(inner);
  hotSpotDiv.title = 'Aller vers ' + args.dest + '.png';
}

try {
  const viewer = pannellum.viewer('panorama', {
    default: {
      firstScene: '01',
      autoLoad: true,
      sceneFadeDuration: 250,
      showControls: true,
      mouseZoom: true,
      keyboardZoom: true,
      compass: false
    },
    scenes: scenes
  });

  viewer.on('scenechange', function(id) {
    document.getElementById('scene').textContent = id + '.png';
  });

  viewer.on('error', function(message) {
    const e = document.getElementById('error');
    e.style.display = 'block';
    e.textContent = 'Erreur panorama : ' + message +
      ' — vérifie que 01.png à 08.png sont dans le même dossier que index.html.';
  });
} catch(err) {
  const e = document.getElementById('error');
  e.style.display = 'block';
  e.textContent = 'Erreur de chargement : ' + err.message;
}
