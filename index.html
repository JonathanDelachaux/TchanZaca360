<style>
html,body,#pano{width:100%;height:100%;margin:0;overflow:hidden;background:#111}
.pnlm-container{background:#111}
.pnlm-hotspot-base.sv-anchor{
 width:112px!important;height:112px!important;
 margin-left:-56px!important;margin-top:-56px!important;
 background:none!important;border:0!important;
 cursor:pointer;
}
/* Google-Street-View-like navigation marker:
   a white forward chevron on a translucent blue road patch. */
.sv-marker{
 position:absolute;inset:0;pointer-events:none;
 transform:perspective(180px) rotateX(61deg);
 transform-origin:50% 60%;
 filter:drop-shadow(0 5px 4px rgba(0,0,0,.42));
 transition:transform .12s ease,opacity .12s ease;
}
.sv-anchor:hover .sv-marker{
 transform:perspective(180px) rotateX(61deg) scale(1.12);
 opacity:.92;
}
.sv-road{
 position:absolute;left:19px;top:31px;width:74px;height:49px;
 border-radius:50%;
 background:rgba(55,145,245,.32);
 border:2px solid rgba(255,255,255,.78);
 box-shadow:inset 0 0 0 2px rgba(45,125,235,.32);
}
.sv-chevron{
 position:absolute;left:37px;top:17px;width:38px;height:38px;
 border-top:11px solid #fff;border-right:11px solid #fff;
 transform:rotate(-45deg);
 box-sizing:border-box;
 filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));
}
#name{
 position:fixed;left:12px;bottom:12px;z-index:10;
 font:12px Arial,sans-serif;color:#fff;background:rgba(0,0,0,.36);
 padding:5px 8px;border-radius:4px;pointer-events:none
}
#home{
 position:fixed;right:14px;bottom:14px;z-index:10;
 width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.7);
 color:#fff;background:rgba(0,0,0,.38);font-size:21px;cursor:pointer
}
@media(max-width:700px){
 .pnlm-hotspot-base.sv-anchor{width:132px!important;height:132px!important;margin-left:-66px!important;margin-top:-66px!important}
 .sv-road{left:22px;top:37px;width:88px;height:57px}
 .sv-chevron{left:44px;top:20px;width:44px;height:44px}
}
</style>

<div id="pano"></div><div id="name">TZ000000</div><button id="home" aria-label="Recentrer">◎</button>
