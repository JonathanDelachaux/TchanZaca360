<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tchan-Zâca 360</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #panorama {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Navigation type Google Street View : flèche blanche posée au sol */
    .nav-hotspot {
      position: relative;
      width: 72px;
      height: 54px;
      cursor: pointer;
      user-select: none;
      transform-origin: 50% 70%;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.55));
      transition: transform .12s ease, opacity .12s ease;
      opacity: .96;
    }

    .nav-hotspot:hover {
      transform: scale(1.10);
      opacity: 1;
    }

    /* halo elliptique au sol */
    .nav-hotspot::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 17px;
      width: 60px;
      height: 27px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.18);
      transform: perspective(95px) rotateX(60deg);
      box-sizing: border-box;
    }

    /* chevron avant */
    .nav-hotspot::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 7px;
      width: 24px;
      height: 24px;
      border-top: 7px solid #fff;
      border-right: 7px solid #fff;
      transform: rotate(-45deg);
      box-sizing: border-box;
      text-shadow: 0 2px 3px rgba(0,0,0,.5);
    }

    /* retour : même flèche tournée de 180° */
    .nav-hotspot.prev {
      transform: rotate(180deg);
    }

    .nav-hotspot.prev:hover {
      transform: rotate(180deg) scale(1.10);
    }

    @media (max-width: 700px) {
      .nav-hotspot {
        width: 82px;
        height: 62px;
      }
      .nav-hotspot::before {
        width: 68px;
        height: 31px;
      }
      .nav-hotspot::after {
        left: 28px;
        top: 8px;
      }
    }

    /* Petit indicateur pendant un changement de panorama */
    #loading {
      position: fixed;
      z-index: 50;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 12px;
      border-radius: 4px;
      background: rgba(0,0,0,.58);
      color: white;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
    }

    #loading.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="panorama"></div>
  <div id="loading">Chargement…</div>

  <script>
    const loading = document.getElementById('loading');

    function hotspotElement(hotSpotDiv, args) {
      hotSpotDiv.classList.add('nav-hotspot', args.kind);
      hotSpotDiv.title = (args.kind === 'prev' ? 'Revenir vers ' : 'Avancer vers ') + args.label;
      hotSpotDiv.setAttribute('aria-label', hotSpotDiv.title);
    }

    const viewer = pannellum.viewer('panorama', {
      default: {
        firstScene: '01',
        autoLoad: true,
        sceneFadeDuration: 300,
        showControls: true,
        compass: false
      },

      scenes: {
        '01': {
          type: 'equirectangular',
          panorama: '01.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -13.21, yaw: 17.51, type: 'scene', sceneId: '09',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'09'} },
            { pitch: 0.20, yaw: 178.80, type: 'scene', sceneId: '02',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'02'} }
          ]
        },

        '02': {
          type: 'equirectangular',
          panorama: '02.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: 1.76, yaw: 4.31, type: 'scene', sceneId: '01',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'01'} },
            { pitch: -2.44, yaw: 176.45, type: 'scene', sceneId: '03',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'03'} }
          ]
        },

        '03': {
          type: 'equirectangular',
          panorama: '03.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -5.31, yaw: 5.06, type: 'scene', sceneId: '02',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'02'} },
            { pitch: -9.45, yaw: 177.54, type: 'scene', sceneId: '04',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'04'} }
          ]
        },

        '04': {
          type: 'equirectangular',
          panorama: '04.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -12.24, yaw: 5.79, type: 'scene', sceneId: '03',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'03'} },
            { pitch: -25.88, yaw: 170.91, type: 'scene', sceneId: '05',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'05'} }
          ]
        },

        '05': {
          type: 'equirectangular',
          panorama: '05.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -6.48, yaw: 1.84, type: 'scene', sceneId: '04',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'04'} },
            { pitch: -2.15, yaw: 90.45, type: 'scene', sceneId: '07',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'07'} },
            { pitch: -1.75, yaw: 105.81, type: 'scene', sceneId: '08',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'08'} }
          ]
        },

        '06': {
          type: 'equirectangular',
          panorama: '06.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -5.34, yaw: -47.78, type: 'scene', sceneId: '05',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'05'} },
            { pitch: -3.08, yaw: 65.79, type: 'scene', sceneId: '07',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'07'} },
            { pitch: -2.42, yaw: 98.69, type: 'scene', sceneId: '08',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'08'} }
          ]
        },

        '07': {
          type: 'equirectangular',
          panorama: '07.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -2.41, yaw: -86.94, type: 'scene', sceneId: '05',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'05'} }
          ]
        },

        '08': {
          type: 'equirectangular',
          panorama: '08.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -3.90, yaw: -79.50, type: 'scene', sceneId: '06',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'06'} },
            { pitch: -2.68, yaw: 177.24, type: 'scene', sceneId: '09',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'09'} }
          ]
        },

        '09': {
          type: 'equirectangular',
          panorama: '09.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -6.26, yaw: 1.88, type: 'scene', sceneId: '08',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'08'} },
            { pitch: -8.74, yaw: 168.57, type: 'scene', sceneId: '01',
              targetPitch: 'same', targetYaw: 'same', targetHfov: 'same',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'01'} }
          ]
        }
      }
    });

    /*
      Précharge uniquement les panoramas reliés à la scène courante.
      C'est plus rapide que d'attendre au clic, sans charger les 9 images
      d'un seul coup sur téléphone.
    */
    const neighbours = {
      '01':['09','02'],
      '02':['01','03'],
      '03':['02','04'],
      '04':['03','05'],
      '05':['04','07','08'],
      '06':['05','07','08'],
      '07':['05'],
      '08':['06','09'],
      '09':['08','01']
    };

    const preloaded = new Set();

    function preloadScene(id) {
      if (preloaded.has(id)) return;
      const img = new Image();
      img.decoding = 'async';
      img.src = id + '.png';
      preloaded.add(id);
    }

    viewer.on('scenechange', function(sceneId) {
      loading.classList.add('show');
      (neighbours[sceneId] || []).forEach(preloadScene);
    });

    viewer.on('load', function() {
      loading.classList.remove('show');
      const current = viewer.getScene();
      (neighbours[current] || []).forEach(preloadScene);
    });

    // Préchargement des voisins de la première scène dès l'ouverture.
    ['09','02'].forEach(preloadScene);
  </script>
</body>
</html>
