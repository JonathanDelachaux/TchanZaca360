<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tchan-Zâca Street View</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
html,body,#panorama{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
.street-arrow{width:90px;height:90px;cursor:pointer;filter:drop-shadow(0 3px 4px rgba(0,0,0,.75))}
.street-arrow:before{content:"";position:absolute;left:16px;top:12px;width:58px;height:68px;background:rgba(255,255,255,.94);clip-path:polygon(50% 0,100% 48%,70% 48%,70% 100%,30% 100%,30% 48%,0 48%)}
.street-arrow:hover:before{background:#fff}
.street-arrow.back{transform:rotate(180deg)}
</style>
</head>
<body>
<div id="panorama"></div>
<script>
function makeArrow(div,args){
 div.classList.add("street-arrow");
 if(args.direction==="back") div.classList.add("back");
 div.onclick=function(e){e.stopPropagation();viewer.loadScene(args.sceneId)};
}
const scenes={};
for(let i=1;i<=9;i++){
 const id=String(i).padStart(2,"0");
 const prev=String(i===1?9:i-1).padStart(2,"0");
 const next=String(i===9?1:i+1).padStart(2,"0");
 scenes[id]={
  type:"equirectangular",panorama:id+".png",autoLoad:true,hfov:105,pitch:0,yaw:0,
  hotSpots:[
   {pitch:-32,yaw:-18,cssClass:"street-arrow",createTooltipFunc:makeArrow,
    createTooltipArgs:{sceneId:prev,direction:"back"}},
   {pitch:-32,yaw:18,cssClass:"street-arrow",createTooltipFunc:makeArrow,
    createTooltipArgs:{sceneId:next,direction:"forward"}}
  ]
 };
}
const viewer=pannellum.viewer("panorama",{
 default:{firstScene:"01",sceneFadeDuration:300,autoLoad:true,showControls:true,mouseZoom:true},
 scenes:scenes
});
</script>
</body>
</html>
