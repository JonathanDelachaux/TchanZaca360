<style>
html, body, #panorama {
  width:100%; height:100%; margin:0; overflow:hidden; background:#000;
}
.pnlm-container { background:#000; }

/* Flèche blanche, sobre, posée au sol */
.tz-arrow {
  width:76px !important;
  height:64px !important;
  margin-left:-38px !important;
  margin-top:-32px !important;
  background:none !important;
  border:none !important;
  cursor:pointer;
}
.tz-arrow-inner {
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.92;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.65));
  transform:perspective(150px) rotateX(59deg);
  transform-origin:50% 65%;
  transition:opacity .12s ease, transform .12s ease;
}
.tz-arrow:hover .tz-arrow-inner {
  opacity:1;
  transform:perspective(150px) rotateX(59deg) scale(1.12);
}
.tz-arrow-shape {
  position:absolute;
  left:19px;
  top:7px;
  width:38px;
  height:38px;
  border-top:9px solid white;
  border-right:9px solid white;
  transform:rotate(-45deg);
  box-sizing:border-box;
}
.tz-arrow-tail {
  position:absolute;
  left:33px;
  top:29px;
  width:10px;
  height:27px;
  background:white;
  border-radius:3px;
}
.tz-arrow-shadow {
  position:absolute;
  left:12px;
  top:35px;
  width:52px;
  height:18px;
  border:2px solid rgba(255,255,255,.58);
  border-radius:50%;
  box-sizing:border-box;
}

/* Gyroscope: smartphone seulement */
#gyroBtn {
  display:none;
  position:fixed;
  z-index:100;
  left:50%;
  bottom:max(18px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:11px 16px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:22px;
  background:rgba(20,20,20,.72);
  color:#fff;
  font:600 14px Arial,sans-serif;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  cursor:pointer;
}
#gyroBtn.active {
  background:rgba(30,100,55,.78);
}
#sceneName {
  position:fixed;
  z-index:30;
  left:10px;
  bottom:10px;
  padding:4px 7px;
  border-radius:4px;
  background:rgba(0,0,0,.30);
  color:#fff;
  font:11px Arial,sans-serif;
  pointer-events:none;
}

@media (pointer:coarse) and (max-width:900px) {
  #gyroBtn { display:block; }
  .tz-arrow {
    width:94px !important; height:76px !important;
    margin-left:-47px !important; margin-top:-38px !important;
  }
  .tz-arrow-inner { transform:perspective(170px) rotateX(59deg) scale(1.12); }
  .tz-arrow:hover .tz-arrow-inner { transform:perspective(170px) rotateX(59deg) scale(1.18); }
}
</style>

const viewer = pannellum.viewer('panorama', {
  default: {
    firstScene:'01',
    autoLoad:true,
    sceneFadeDuration:180,
    showControls:true,
    compass:false,
    orientationOnByDefault:false
  },
  scenes: scenes
});

const sceneName = document.getElementById('sceneName');
const gyroBtn = document.getElementById('gyroBtn');
let gyroWanted = false;

// Keep nearby scenes ready for faster transitions.
const cache = {};
function preload(url) {
  if (cache[url]) return;
  const img = new Image();
  img.src = url;
  cache[url] = img;
}
function preloadNeighbours(id) {
  const hs = scenes[id].hotSpots || [];
  hs.forEach(h => preload(scenes[h.sceneId].panorama));
}

viewer.on('load', function() {
  preloadNeighbours(viewer.getScene());
});

viewer.on('scenechange', function(id) {
  sceneName.textContent = id;
  preloadNeighbours(id);

  // Reassert gyroscope state after every scene change.
  if (gyroWanted) {
    setTimeout(function() {
      if (!viewer.isOrientationActive()) viewer.startOrientation();
    }, 120);
  }
});

// iOS requires explicit permission from a user gesture.
// Android generally starts directly.
async function enableGyro() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') return;
    }

    gyroWanted = true;
    viewer.startOrientation();

    gyroBtn.textContent = 'Gyroscope activé';
    gyroBtn.classList.add('active');
  } catch (e) {
    gyroBtn.textContent = 'Gyroscope indisponible';
  }
}

gyroBtn.addEventListener('click', function() {
  if (!gyroWanted) {
    enableGyro();
  } else {
    gyroWanted = false;
    viewer.stopOrientation();
    gyroBtn.textContent = 'Activer le gyroscope';
    gyroBtn.classList.remove('active');
  }
});

// Quietly preload remaining scenes later, after initial interaction/loading.
setTimeout(function() {
  Object.values(scenes).forEach(s => preload(s.panorama));
}, 3500);
