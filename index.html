<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tchan-Zâca 360</title>
<script src="https://www.marzipano.net/demos/vendor/marzipano.js"></script>
<style>
html,body,#pano{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
.hotspot{width:54px;height:54px;border:0;background:rgba(0,0,0,.25);border-radius:50%;
display:flex;align-items:center;justify-content:center;cursor:pointer;filter:drop-shadow(0 2px 3px #000)}
.hotspot:before{content:"➜";font:42px/1 Arial;color:white;transform:rotate(var(--rot));}
.label{position:absolute;top:12px;left:12px;color:#fff;background:#0008;padding:6px 9px;border-radius:5px;
font:14px Arial;z-index:20}
</style>
</head>
<body>
<div id="pano"></div><div class="label" id="label"></div>
<script>
const viewer = new Marzipano.Viewer(document.getElementById('pano'));
const geometry = new Marzipano.EquirectGeometry([{width:4096}]);
const limiter = Marzipano.RectilinearView.limit.traditional(4096, Math.PI/2);
const scenes = {};

// Croquis retranscrit : 01↔02, 01↔03, 02↔03, 02↔04, 02↔06,
// 03↔04, 04↔05, 05↔07, 07↔08.
// Les yaw ci-dessous placent les flèches autour de l'utilisateur.
// À l'arrivée, on conserve exactement la direction de déplacement.
const graph = {
 "01":[["02",-2.95],["03",-2.25]],
 "02":[["01", 0.15],["03",-0.55],["04", 2.85],["06", 0.75]],
 "03":[["01", 0.95],["02", 2.45],["04", 2.90]],
 "04":[["02",-0.05],["03", 0.55],["05", 1.55]],
 "05":[["04",-1.60],["07", 1.55]],
 "06":[["02",-2.35]],
 "07":[["05",-1.55],["08", 2.95]],
 "08":[["07",-0.15]]
};

function makeScene(id){
  const source = Marzipano.ImageUrlSource.fromString(id + ".png");
  const view = new Marzipano.RectilinearView({yaw:0,pitch:0,fov:Math.PI/2}, limiter);
  const scene = viewer.createScene({source,geometry,view,pinFirstLevel:true});
  scenes[id]={scene,view};
}
Object.keys(graph).forEach(makeScene);

function norm(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }

function go(from,to,travelYaw){
  // La photo suivante s'ouvre dans LA MÊME direction que la flèche cliquée.
  scenes[to].view.setParameters({yaw:norm(travelYaw),pitch:0,fov:scenes[from].view.fov()});
  scenes[to].scene.switchTo({transitionDuration:220});
  document.getElementById("label").textContent = to + ".png";
}

for (const [from,links] of Object.entries(graph)){
  for (const [to,yaw] of links){
    const el=document.createElement("div");
    el.className="hotspot";
    // Rotation visuelle de la flèche selon sa direction à l'écran.
    el.style.setProperty("--rot","-90deg");
    el.title=to+".png";
    el.onclick=()=>go(from,to,yaw);
    scenes[from].scene.hotspotContainer().createHotspot(
      el,{yaw:yaw,pitch:-0.38},{perspective:{radius:900,extraTransforms:"rotateX(65deg)"}}
    );
  }
}
scenes["01"].scene.switchTo();
document.getElementById("label").textContent="01.png";
</script>
</body>
</html>
