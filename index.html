<!doctype html>

<meta charset="utf-8">

<title>Tchan-Zâca — Place des Mascarades 360°</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<style>
html,body,#panorama {
  width:100%; height:100%; margin:0; overflow:hidden; background:#000;
}
.pnlm-container { background:#000; }

/* IMPORTANT : aucun transform ici.
   Pannellum utilise transform pour placer le hotspot dans la sphère. */
.sv-hotspot {
  width:92px !important;
  height:72px !important;
  margin-left:-46px !important;
  margin-top:-36px !important;
  background:none !important;
  border:none !important;
  cursor:pointer;
}

.sv-arrow {
  position:absolute;
  inset:0;
  pointer-events:none;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.65));
  transition:opacity .12s ease;
}

/* halo au sol */
.sv-arrow .oval {
  position:absolute;
  left:10px;
  top:31px;
  width:72px;
  height:27px;
  border:3px solid rgba(255,255,255,.97);
  border-radius:50%;
  background:rgba(255,255,255,.13);
  box-sizing:border-box;
}

/* chevron blanc vers l'avant */
.sv-arrow .chevron {
  position:absolute;
  left:31px;
  top:9px;
  width:31px;
  height:31px;
  border-top:9px solid white;
  border-right:9px solid white;
  transform:rotate(-45deg);
  box-sizing:border-box;
}

.sv-hotspot:hover .sv-arrow { opacity:.72; }

.sv-label {
  position:absolute;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font:600 10px Arial,sans-serif;
  background:rgba(0,0,0,.48);
  padding:2px 5px;
  border-radius:8px;
  white-space:nowrap;
}

/* nom discret de la vue actuelle */
#sceneName {
  position:fixed;
  left:14px;
  bottom:14px;
  z-index:20;
  color:white;
  font:12px Arial,sans-serif;
  padding:6px 9px;
  background:rgba(0,0,0,.38);
  border-radius:4px;
  pointer-events:none;
}

/* bouton recentrage */
#recenter {
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:20;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:50%;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:21px;
  cursor:pointer;
}

@media(max-width:700px) {
  .sv-hotspot {
    width:106px !important;
    height:82px !important;
    margin-left:-53px !important;
    margin-top:-41px !important;
  }
  .sv-arrow .oval { left:10px; top:35px; width:86px; height:31px; }
  .sv-arrow .chevron { left:36px; top:9px; width:34px; height:34px; }
  .sv-label { top:66px; }
}
</style>
</head>
<body>
<div id="panorama"></div>
<div id="sceneName">TZ000000</div>
<button id="recenter" title="Recentrer">◎</button>

function makeStreetArrow(hotSpotDiv, args) {
  const wrap = document.createElement('div');
  wrap.className = 'sv-arrow';

  const oval = document.createElement('div');
  oval.className = 'oval';

  const chevron = document.createElement('div');
  chevron.className = 'chevron';

  const label = document.createElement('div');
  label.className = 'sv-label';
  label.textContent = args.label;

  wrap.appendChild(oval);
  wrap.appendChild(chevron);
  wrap.appendChild(label);
  hotSpotDiv.appendChild(wrap);
}

    firstScene: 'TZ000000',
    autoLoad: true,
    sceneFadeDuration: 280,
    showControls: true,
    mouseZoom: true,
    keyboardZoom: true,
    compass: false
  },
  scenes: scenes
});

viewer.on('scenechange', function(id) {
  document.getElementById('sceneName').textContent = id;

  // Précharge les panoramas voisins pour rendre les changements plus rapides.
  const hs = scenes[id].hotSpots || [];
  hs.forEach(h => {
    const img = new Image();
    img.src = scenes[h.sceneId].panorama;
  });
});

document.getElementById('recenter').addEventListener('click', function() {
  viewer.setPitch(-2, 400);
  viewer.setYaw(0, 400);
  viewer.setHfov(105, 400);
});

// Précharge les voisins de la première scène.
(scenes.TZ000000.hotSpots || []).forEach(h => {
  const img = new Image();
  img.src = scenes[h.sceneId].panorama;
});
