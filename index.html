<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tchan-Zâca 360</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
html,body,#panorama{width:100%;height:100%;margin:0;background:#000;overflow:hidden}#nav{position:fixed;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px}button{border:1px solid #fff;background:rgba(0,0,0,.55);color:#fff;padding:10px 15px;border-radius:5px;cursor:pointer;font-size:15px}
</style>
</head><body>
<div id="panorama"></div><div id="nav"><button onclick="viewer.loadScene('image01')">01</button><button onclick="viewer.loadScene('image02')">02</button><button onclick="viewer.loadScene('image03')">03</button></div>
<script>
const viewer=pannellum.viewer('panorama',{default:{firstScene:'image01',autoLoad:true,sceneFadeDuration:800},scenes:{image01:{type:'equirectangular',panorama:'01.png'},image02:{type:'equirectangular',panorama:'02.png'},image03:{type:'equirectangular',panorama:'03.png'}}});
</script></body></html>
