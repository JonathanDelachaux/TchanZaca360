<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tchan-Zâca 360</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #panorama {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Flèches au sol type Street View.
       Aucun transform sur .nav-hotspot : Pannellum s'en sert pour placer le hotspot. */
    .nav-hotspot {
      width: 86px;
      height: 70px;
      cursor: pointer;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .street-arrow-shape {
      position: absolute;
      left: 8px;
      top: 5px;
      width: 70px;
      height: 58px;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.7));
      transition: opacity .12s ease;
    }

    .street-arrow-shape::before {
      content: "";
      position: absolute;
      left: 2px;
      bottom: 0;
      width: 66px;
      height: 28px;
      border: 2px solid rgba(255,255,255,.96);
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      box-sizing: border-box;
    }

    .street-arrow-shape::after {
      content: "";
      position: absolute;
      left: 23px;
      top: 2px;
      width: 25px;
      height: 25px;
      border-top: 8px solid #fff;
      border-right: 8px solid #fff;
      box-sizing: border-box;
      transform: rotate(-45deg);
    }

    .street-arrow-shape.prev::after {
      transform: rotate(135deg);
      top: 19px;
    }

    .nav-hotspot:hover .street-arrow-shape {
      opacity: .72;
    }

    @media (max-width: 700px) {
      .nav-hotspot {
        width: 96px;
        height: 78px;
      }
      .street-arrow-shape {
        left: 10px;
        top: 4px;
        width: 76px;
        height: 66px;
      }
      .street-arrow-shape::before {
        width: 72px;
        height: 31px;
      }
      .street-arrow-shape::after {
        left: 25px;
        width: 27px;
        height: 27px;
      }
    }

    /* Petit indicateur pendant un changement de panorama */
    #loading {
      position: fixed;
      z-index: 50;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 12px;
      border-radius: 4px;
      background: rgba(0,0,0,.58);
      color: white;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
    }

    #loading.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="panorama"></div>
  <div id="loading">Chargement…</div>

  <script>
    const loading = document.getElementById('loading');

    function hotspotElement(hotSpotDiv, args) {
      hotSpotDiv.classList.add('nav-hotspot');

      const arrow = document.createElement('span');
      arrow.className = 'street-arrow-shape ' + args.kind;
      hotSpotDiv.appendChild(arrow);

      hotSpotDiv.title = (args.kind === 'prev' ? 'Revenir vers ' : 'Avancer vers ') + args.label;
      hotSpotDiv.setAttribute('aria-label', hotSpotDiv.title);
    }

    const viewer = pannellum.viewer('panorama', {
      default: {
        firstScene: '01',
        autoLoad: true,
        sceneFadeDuration: 280,
        showControls: true,
        compass: false
      },

      scenes: {
        '01': {
          type: 'equirectangular',
          panorama: '01.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -13.21, yaw: 17.51, type: 'scene', sceneId: '09',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'09'} },
            { pitch: 0.20, yaw: 178.80, type: 'scene', sceneId: '02',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'02'} }
          ]
        },

        '02': {
          type: 'equirectangular',
          panorama: '02.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: 1.76, yaw: 4.31, type: 'scene', sceneId: '01',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'01'} },
            { pitch: -2.44, yaw: 176.45, type: 'scene', sceneId: '03',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'03'} }
          ]
        },

        '03': {
          type: 'equirectangular',
          panorama: '03.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -5.31, yaw: 5.06, type: 'scene', sceneId: '02',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'02'} },
            { pitch: -9.45, yaw: 177.54, type: 'scene', sceneId: '04',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'04'} }
          ]
        },

        '04': {
          type: 'equirectangular',
          panorama: '04.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -12.24, yaw: 5.79, type: 'scene', sceneId: '03',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'03'} },
            { pitch: -25.88, yaw: 170.91, type: 'scene', sceneId: '05',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'05'} }
          ]
        },

        '05': {
          type: 'equirectangular',
          panorama: '05.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -6.48, yaw: 1.84, type: 'scene', sceneId: '04',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'04'} },
            { pitch: -2.15, yaw: 90.45, type: 'scene', sceneId: '07',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'07'} },
            { pitch: -1.75, yaw: 105.81, type: 'scene', sceneId: '08',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'08'} }
          ]
        },

        '06': {
          type: 'equirectangular',
          panorama: '06.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -5.34, yaw: -47.78, type: 'scene', sceneId: '05',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'05'} },
            { pitch: -3.08, yaw: 65.79, type: 'scene', sceneId: '07',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'07'} },
            { pitch: -2.42, yaw: 98.69, type: 'scene', sceneId: '08',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'08'} }
          ]
        },

        '07': {
          type: 'equirectangular',
          panorama: '07.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -2.41, yaw: -86.94, type: 'scene', sceneId: '05',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'05'} }
          ]
        },

        '08': {
          type: 'equirectangular',
          panorama: '08.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -3.90, yaw: -79.50, type: 'scene', sceneId: '06',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'06'} },
            { pitch: -2.68, yaw: 177.24, type: 'scene', sceneId: '09',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'09'} }
          ]
        },

        '09': {
          type: 'equirectangular',
          panorama: '09.png',
          pitch: 0,
          yaw: 0,
          hfov: 100,
          hotSpots: [
            { pitch: -6.26, yaw: 1.88, type: 'scene', sceneId: '08',
              cssClass: 'prev', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'prev', label:'08'} },
            { pitch: -8.74, yaw: 168.57, type: 'scene', sceneId: '01',
              cssClass: 'next', createTooltipFunc: hotspotElement,
              createTooltipArgs: {kind:'next', label:'01'} }
          ]
        }
      }
    });

    /*
      Précharge uniquement les panoramas reliés à la scène courante.
      C'est plus rapide que d'attendre au clic, sans charger les 9 images
      d'un seul coup sur téléphone.
    */
    const neighbours = {
      '01':['09','02'],
      '02':['01','03'],
      '03':['02','04'],
      '04':['03','05'],
      '05':['04','07','08'],
      '06':['05','07','08'],
      '07':['05'],
      '08':['06','09'],
      '09':['08','01']
    };

    const preloaded = new Set();

    function preloadScene(id) {
      if (preloaded.has(id)) return;
      const img = new Image();
      img.decoding = 'async';
      img.src = id + '.png';
      preloaded.add(id);
    }

    viewer.on('scenechange', function(sceneId) {
      loading.classList.add('show');
      (neighbours[sceneId] || []).forEach(preloadScene);
    });

    viewer.on('load', function() {
      loading.classList.remove('show');
      const current = viewer.getScene();
      (neighbours[current] || []).forEach(preloadScene);
    });

    // Préchargement des voisins de la première scène dès l'ouverture.
    ['09','02'].forEach(preloadScene);
  </script>
</body>
</html>
