.sv-hotspot{
 width:118px!important;height:96px!important;
 margin-left:-59px!important;margin-top:-48px!important;
 background:none!important;border:none!important;cursor:pointer;
}
.sv-floor{
 position:absolute;inset:0;pointer-events:none;
 transform:perspective(175px) rotateX(62deg);
 transform-origin:50% 62%;
 filter:drop-shadow(0 5px 4px rgba(0,0,0,.48));
 transition:transform .12s ease,opacity .12s ease;
}
.sv-hotspot:hover .sv-floor{
 transform:perspective(175px) rotateX(62deg) scale(1.12);
 opacity:.88;
}
.sv-disc{
 position:absolute;left:14px;top:30px;width:90px;height:48px;
 border-radius:50%;
 background:rgba(54,142,245,.25);
 border:3px solid rgba(255,255,255,.96);
 box-shadow:inset 0 0 0 2px rgba(70,140,230,.28);
 box-sizing:border-box;
}
.sv-chevron{
 position:absolute;left:38px;top:11px;width:40px;height:40px;
 border-top:11px solid white;border-right:11px solid white;
 transform:rotate(-45deg);box-sizing:border-box;
 filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));
}
#sceneName{
 position:fixed;left:12px;bottom:12px;z-index:20;
 color:#fff;background:rgba(0,0,0,.28);padding:5px 8px;
 border-radius:4px;font:12px Arial,sans-serif;pointer-events:none;

const viewer=pannellum.viewer('panorama',{
 default:{
   firstScene:'01',
   autoLoad:true,
   sceneFadeDuration:180,
   showControls:true,
   mouseZoom:true,
   keyboardZoom:true,
   compass:false
 },
 scenes
});

// Preload ONLY connected panoramas, then quietly preload the rest.
// This keeps the first display fast while making subsequent movement near-instant.
const cached={};
function preload(url){
 if(cached[url]) return;
 const im=new Image(); im.src=url; cached[url]=im;
}
function preloadNeighbours(id){
 (scenes[id].hotSpots||[]).forEach(h=>preload(scenes[h.sceneId].panorama));
}
viewer.on('load',()=>preloadNeighbours(viewer.getScene()));
viewer.on('scenechange',id=>{
 document.getElementById('sceneName').textContent=id;
 preloadNeighbours(id);
});

setTimeout(()=>{
 Object.values(scenes).forEach(s=>preload(s.panorama));
},2500);
